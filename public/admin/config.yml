backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: public/images/writing
public_folder: /images/writing

locale: en

collections:
  - name: posts-en
    label: "Posts (English)"
    folder: src/content/posts/en
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Excerpt", name: excerpt, widget: text }
      - { label: "Tags", name: tags, widget: list, allow_add: true }
      - { label: "Cover Image", name: coverImage, widget: image, required: false, allow_multiple: false }
      - { label: "LinkedIn URL", name: linkedinUrl, widget: string, required: false }
      - { label: "Language", name: lang, widget: hidden, default: en }
      - { label: "Body", name: body, widget: markdown }

  - name: posts-fr
    label: "Posts (Français)"
    folder: src/content/posts/fr
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Extrait", name: excerpt, widget: text }
      - { label: "Étiquettes", name: tags, widget: list, allow_add: true }
      - { label: "Image de couverture", name: coverImage, widget: image, required: false, allow_multiple: false }
      - { label: "URL LinkedIn", name: linkedinUrl, widget: string, required: false }
      - { label: "Langue", name: lang, widget: hidden, default: fr }
      - { label: "Contenu", name: body, widget: markdown }
